name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep uv's output stable and its cache in a predictable place.
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies from the lock file
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the declared floor in pyproject.toml; 3.13 catches drift
        # between the floor and what developers actually run.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies from the lock file
        run: uv sync --all-groups

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing
        # No `--cov-fail-under` yet: there is no agreed baseline, and a
        # threshold picked now would be a number to game rather than a target.
